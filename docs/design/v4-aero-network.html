<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinder Neural Org</title>
<style>
@font-face{font-family:Selawik;src:url(https://cdn.jsdelivr.net/npm/winstrap@0.5.12/dist/fonts/selawkl.ttf) format("truetype");font-weight:300;font-display:swap}
@font-face{font-family:Selawik;src:url(https://cdn.jsdelivr.net/npm/winstrap@0.5.12/dist/fonts/selawk.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Selawik;src:url(https://cdn.jsdelivr.net/npm/winstrap@0.5.12/dist/fonts/selawksb.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:Selawik;src:url(https://cdn.jsdelivr.net/npm/winstrap@0.5.12/dist/fonts/selawkb.ttf) format("truetype");font-weight:700;font-display:swap}
:root{
  --font:Selawik,"Segoe UI","Open Sans",system-ui,sans-serif;
  --ink:#0B2A4A; --ink-2:#3A5A7A; --raio:16px;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.25,.8,.25,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#BFE6FC;font-family:var(--font);color:var(--ink)}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #2A8CE8}

/* ============ Glass recipes (Jopestpe "Frutiger Aero | Glass"), given jobs ============ */
/* FrutigerAero7, milk glass: panels that hold text */
.milk{position:absolute;z-index:10;border-radius:var(--raio);overflow:hidden;
  background:linear-gradient(175deg,rgb(255 255 255/.74) 0%,rgb(255 255 255/.48) 45%,rgb(255 255 255/.6) 100%);
  border:1px solid rgb(255 255 255/.8);backdrop-filter:blur(14px) brightness(1.06) saturate(1.2);-webkit-backdrop-filter:blur(14px) brightness(1.06) saturate(1.2);
  box-shadow:0 8px 28px rgb(0 40 100/.18),inset 0 1px 0 rgb(255 255 255/.95),inset 0 -1px 0 rgb(255 255 255/.35);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
/* the pen's light sweep on hover */
.milk::after{content:"";position:absolute;top:0;left:-100%;width:70%;height:100%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgb(255 255 255/.55),transparent);transform:skewX(-15deg);transition:left .5s}
.milk:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgb(0 40 100/.24),inset 0 1px 0 #fff}
.milk:hover::after{left:150%;transition:left .8s ease-in-out}
/* FrutigerAero6, glossy blue: title bars */
.bar{position:relative;display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;font-weight:600;font-size:15px;text-shadow:0 1px 2px rgb(0 30 80/.55);
  background:linear-gradient(160deg,rgb(60 140 255/.85) 0%,rgb(0 90 210/.92) 50%,rgb(0 50 140/.9) 100%);
  border-bottom:1px solid rgb(0 30 100/.35);box-shadow:inset 0 1px 0 rgb(200 230 255/.7)}
.bar::before{content:"";position:absolute;top:0;left:3%;width:94%;height:50%;border-radius:12px 12px 50% 50%;pointer-events:none;background:linear-gradient(rgb(220 240 255/.55),transparent)}
.bar > *{position:relative}
.bar .live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-weight:400;font-size:13px;color:#DDF2FF}
.bar .live i{width:8px;height:8px;border-radius:50%;background:#7CFF9B;box-shadow:0 0 8px #7CFF9B}
/* Glossy orb (Aero) */
.orb{flex:none;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;position:relative;
  background:radial-gradient(circle at 35% 28%,rgb(255 255 255/.85),#5BD86B 38%,#1F9A3A 75%,#0D6A26);
  box-shadow:inset 0 -3px 6px rgb(0 0 0/.25),inset 0 0 0 1px rgb(255 255 255/.5),0 2px 6px rgb(0 40 0/.35)}

#title{left:28px;top:28px;width:330px}
#title .body{padding:16px 18px 18px}
#title .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
#title .eng{font-weight:300;font-size:40px;line-height:1.05;margin:2px 0 6px;transition:opacity .35s,transform .35s}
#title .eng.swap{opacity:0;transform:translateY(6px)}
#title .d{font-size:15px;line-height:1.45;color:var(--ink-2);min-height:44px;transition:opacity .35s}
#title .legend{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
#title .legend span{display:inline-flex;align-items:center;gap:6px}
#title .legend i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 -2px 3px rgb(0 0 0/.25),inset 0 0 0 1px rgb(255 255 255/.5)}

#panel{right:28px;top:28px;width:270px}
#panel .body{padding:14px 18px 18px;display:grid;gap:14px}
.ptitle{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:8px}
.theme-grid{display:flex;gap:16px;justify-content:space-between}
.theme-button{width:46px;height:46px;border-radius:50%;position:relative;transition:transform .4s var(--spring);
  box-shadow:0 4px 10px rgb(0 40 100/.3),inset 0 2px 4px rgb(255 255 255/.5),inset 0 -3px 6px rgb(0 0 0/.22)}
.theme-button::before{content:"";position:absolute;top:8%;left:20%;right:20%;height:42%;border-radius:50%;background:linear-gradient(180deg,rgb(255 255 255/.9),rgb(255 255 255/.1))}
.theme-button::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #fff;opacity:0;transform:scale(1.12);transition:all .3s;box-shadow:0 0 12px rgb(255 255 255/.8)}
.theme-button:hover{transform:scale(1.12) translateY(-2px)}
.theme-button.active::after{opacity:1;transform:scale(1)}
.theme-button .nm{position:absolute;top:calc(100% + 6px);left:50%;translate:-50% 0;font-size:11px;white-space:nowrap;color:var(--ink-2);font-weight:600}
#t0{background:radial-gradient(circle at 30% 30%,#8FE3FF,#1E8BE0 55%,#0A4A9A)}
#t1{background:radial-gradient(circle at 30% 30%,#D4F79A,#4CC24A 55%,#17752E)}
#t2{background:radial-gradient(circle at 30% 30%,#FFE0A8,#FF8A5B 55%,#C2305E)}
.themes{padding-bottom:16px}
.dlabel{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.dlabel b{color:var(--ink);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin-top:6px}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;box-shadow:inset 0 1px 3px rgb(0 40 100/.35),0 1px 0 rgb(255 255 255/.8);
  background:linear-gradient(180deg,rgb(255 255 255/.55),rgb(255 255 255/0) 50%),linear-gradient(90deg,#35C3F0 var(--val,60%),rgb(255 255 255/.5) var(--val,60%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-6px;
  background:radial-gradient(circle at 35% 28%,#fff 0 18%,#BFF0FF 40%,#2AA8E8 85%);box-shadow:0 2px 6px rgb(0 40 100/.4),inset 0 0 0 1px rgb(255 255 255/.7);transition:transform .2s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:#9CD9F2}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 28%,#fff 0 18%,#BFF0FF 40%,#2AA8E8 85%)}
.seg{display:flex;padding:3px;border-radius:99px;background:rgb(255 255 255/.45);box-shadow:inset 0 1px 3px rgb(0 40 100/.25)}
.seg button{flex:1;padding:6px 4px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink-2);transition:all .3s}
.seg button[aria-pressed=true]{color:#fff;text-shadow:0 1px 1px rgb(0 0 0/.3);
  background:linear-gradient(180deg,rgb(255 255 255/.55),rgb(255 255 255/.12) 49%,transparent 50%),linear-gradient(180deg,#4CB2FF,#1460C8);box-shadow:inset 0 0 0 1px rgb(255 255 255/.45),0 1px 3px rgb(0 40 100/.35)}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.switch button{width:46px;height:26px;border-radius:99px;position:relative;background:rgb(0 40 100/.18);box-shadow:inset 0 1px 3px rgb(0 40 100/.35);transition:background .3s}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;transition:left .35s var(--spring);
  background:radial-gradient(circle at 35% 28%,#fff,#E6F2FA 60%,#B7CCDD);box-shadow:0 1px 3px rgb(0 0 0/.3)}
.switch button[aria-pressed=true]{background:linear-gradient(180deg,#7EE07A,#2E9E3A)}
.switch button[aria-pressed=true]::after{left:23px}

/* ============ Controls: glass pills holding XP-style candy squares (reference only) ============ */
#controls{position:fixed;left:50%;bottom:30px;translate:-50% 0;display:flex;gap:14px;z-index:20;padding:8px;border-radius:24px;
  background:linear-gradient(175deg,rgb(255 255 255/.4),rgb(255 255 255/.12));border:1px solid rgb(255 255 255/.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgb(0 40 100/.18),inset 0 1px 0 rgb(255 255 255/.85)}
.ctl{display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:18px;font-weight:600;font-size:15px;color:var(--ink);
  background:linear-gradient(175deg,rgb(255 255 255/.75),rgb(255 255 255/.45));border:1px solid rgb(255 255 255/.85);box-shadow:0 4px 12px rgb(0 40 100/.15);transition:transform .3s var(--spring),box-shadow .3s}
.ctl:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgb(0 40 100/.22)}
.ctl:active{transform:translateY(0)}
.sq{position:relative;display:flex;width:40px;height:40px;border-radius:10px;
  box-shadow:0 0 0 2px #fff inset,-3px -3px 4px rgb(0 0 0/.35) inset,0 2px 4px rgb(0 40 100/.3)}
.sq::before{content:"";position:absolute;inset:3px;border-radius:7px;transition:background-color .3s;background-color:rgb(255 255 255/0);
  background-image:radial-gradient(100% 100% at 0 0,rgb(255 255 255/.6),rgb(255 255 255/0) 40%),radial-gradient(100% 100% at 90% 90%,rgb(255 255 255/.18),rgb(255 255 255/0) 50%);box-shadow:5px 5px 6px rgb(255 255 255/.15) inset}
.ctl:hover .sq::before{background-color:rgb(255 255 255/.2)}
.sq.green{background-color:hsl(119,51%,39%)} .sq.amber{background-color:hsl(37,96%,52%)} .sq.blue{background-color:hsl(210,80%,48%)}
.sq svg{margin:auto;width:28px;height:28px;pointer-events:none;position:relative}
.icon__part{animation-duration:1s}
.anim .i-standby .p1{animation-name:standBy1}
.anim .i-standby .p2{animation-name:standBy2}
.anim .i-standby .p1,.anim .i-standby .p2,.anim .i-reset .p1{transform-origin:12px 12px}
.anim .i-restart .p1{animation-name:restart1;animation-timing-function:cubic-bezier(.68,-.55,.265,1.55)}
.anim .i-reset .p1{animation-name:reset1;animation-timing-function:cubic-bezier(.645,.03,.355,1.4)}
@keyframes standBy1{from{animation-timing-function:cubic-bezier(.645,.045,.355,1);stroke-dashoffset:0;transform:translate(0,0)}33.33%{animation-timing-function:cubic-bezier(.645,.045,.355,1);stroke-dashoffset:-7;transform:translate(0,7px)}66.67%{animation-timing-function:cubic-bezier(.645,.03,.355,2);stroke-dashoffset:3;transform:translate(0,-6px)}to{stroke-dashoffset:0;transform:translate(0,0)}}
@keyframes standBy2{from{animation-timing-function:cubic-bezier(.645,.045,.355,1);stroke-dashoffset:-8.378;transform:rotate(-120deg)}33.33%{animation-timing-function:cubic-bezier(.645,.045,.355,1);stroke-dashoffset:0;transform:rotate(-90deg)}66.67%{animation-timing-function:cubic-bezier(.645,.03,.355,2);stroke-dashoffset:-13.96;transform:rotate(-140deg)}to{stroke-dashoffset:-8.378;transform:rotate(-120deg)}}
@keyframes restart1{from{stroke-dashoffset:-5}to{stroke-dashoffset:-28}}
@keyframes reset1{from{transform:rotate(0)}to{transform:rotate(-360deg)}}

/* ============ Toast: FrutigerAero2 inner-glow bubble, FrutigerAero4 iridescence for Mycelium ============ */
#toast{position:fixed;left:28px;bottom:30px;width:360px;z-index:15;border-radius:20px;overflow:hidden;opacity:0;translate:0 16px;transition:opacity .45s var(--ease),translate .55s var(--spring);pointer-events:none;
  background:radial-gradient(ellipse at center,rgb(255 255 255/.25),rgb(255 255 255/.5));border:1.5px solid rgb(255 255 255/.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 0 30px rgb(255 255 255/.35),0 8px 26px rgb(0 40 100/.22)}
#toast.show{opacity:1;translate:0 0}
#toast::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgb(255 255 255/.7),transparent 60%)}
#toast.myc::after{content:"";position:absolute;top:-40%;left:-10%;width:120%;height:90%;border-radius:50%;filter:blur(10px);pointer-events:none;opacity:.9;
  background:conic-gradient(from 200deg at 50% 30%,rgb(255 100 200/.4),rgb(100 200 255/.45),rgb(200 255 100/.3),rgb(255 200 100/.4),rgb(255 100 200/.4))}
#toast .in{position:relative;z-index:1;display:flex;gap:12px;padding:14px 16px;align-items:center}
#toast .orb{width:40px;height:40px;font-size:18px}
#toast .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
#toast .m{font-size:18px;font-weight:600;line-height:1.2}
#toast .s{font-size:14px;color:var(--ink-2)}
#toast .hops{display:inline-block;margin-left:4px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:600;color:#0B6B4A;background:rgb(220 250 235/.9)}

/* Labels in the scene (CSS2D): milk-glass pills, dark ink */
.lbl{font:600 13px/1 var(--font);color:var(--ink);padding:6px 10px 6px 8px;border-radius:99px;white-space:nowrap;display:flex;align-items:center;gap:6px;
  background:linear-gradient(180deg,rgb(255 255 255/.92),rgb(255 255 255/.7));border:1px solid #fff;box-shadow:0 3px 10px rgb(0 40 100/.22);
  transition:opacity .5s,transform .5s var(--spring);transform:translateY(-22px)}
.lbl i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 -1px 2px rgb(0 0 0/.3)}
.lbl.person{font-weight:400;font-size:12px;padding:4px 9px;background:rgb(255 255 255/.8)}
.lbl.core{font-size:15px;color:#fff;text-shadow:0 1px 2px rgb(0 60 0/.5);transform:translateY(-44px);
  background:linear-gradient(180deg,rgb(255 255 255/.5),rgb(255 255 255/.1) 49%,transparent 50%),linear-gradient(180deg,#5BD86B,#1F8F37);border-color:rgb(255 255 255/.7)}
.lbl.off{opacity:0;transform:translateY(-10px) scale(.9)}
.lbl.hot{box-shadow:0 0 0 3px rgb(255 255 255/.9),0 0 18px #7FE3FF}

.err{position:fixed;inset:auto 0 45% 0;text-align:center;font-size:16px;color:var(--ink);display:none;z-index:30}

@media (max-width:700px){
  #title{left:12px;right:12px;top:12px;width:auto}
  #title .eng{font-size:30px} #title .d{min-height:0} #title .legend{display:none}
  #panel{left:12px;right:12px;top:auto;bottom:96px;width:auto}
  #panel .body{grid-template-columns:1fr 1fr;gap:10px}
  #panel .themes,#panel .switch{display:none}
  #controls{bottom:16px;gap:6px;width:calc(100% - 24px);justify-content:center}
  .ctl{padding:4px 10px 4px 4px;font-size:13px} .sq{width:34px;height:34px}
  #toast{left:12px;right:12px;width:auto;bottom:auto;top:200px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Wayfinder org as a glass neural network"></canvas>

<section id="title" class="milk" aria-live="polite">
  <div class="bar"><span class="orb" style="width:24px;height:24px;font-size:12px">W</span>Wayfinder · Neural Org<span class="live"><i></i>live</span></div>
  <div class="body">
    <div class="k">Engine</div>
    <div class="eng" id="eng">Coordinate</div>
    <p class="d" id="engd">Breaks a goal into steps and sends each one to its real owner.</p>
    <div class="legend"><span><i style="background:radial-gradient(circle at 35% 30%,#fff,#5BD86B 50%,#1F8F37)"></i>Wayfinder</span><span><i id="lg-hub"></i>Department</span><span><i id="lg-person"></i>Person</span></div>
  </div>
</section>

<section id="panel" class="milk">
  <div class="bar">Glass theme</div>
  <div class="body">
    <div class="themes">
      <div class="theme-grid">
        <button class="theme-button active" id="t0" data-theme="0" aria-label="Aqua Sky"><span class="nm">Aqua Sky</span></button>
        <button class="theme-button" id="t1" data-theme="1" aria-label="Eco Leaf"><span class="nm">Eco Leaf</span></button>
        <button class="theme-button" id="t2" data-theme="2" aria-label="Sunset Glass"><span class="nm">Sunset Glass</span></button>
      </div>
    </div>
    <div>
      <div class="dlabel"><span>Density</span><b id="dval">60%</b></div>
      <input type="range" id="density" min="30" max="100" value="60" aria-label="Network density" style="--val:57%">
    </div>
    <div>
      <div class="ptitle">Engine</div>
      <div class="seg" role="group" aria-label="Engine">
        <button data-f="0" aria-pressed="true">Coordinate</button><button data-f="1" aria-pressed="false">Discover</button><button data-f="2" aria-pressed="false">Evolve</button>
      </div>
    </div>
    <div class="switch"><span>Auto tour</span><button id="auto" aria-pressed="true" aria-label="Auto tour"></button></div>
  </div>
</section>

<div id="controls">
  <button class="ctl" id="morph"><span class="sq green"><svg class="i-restart" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff" stroke-dasharray="6 17" stroke-dashoffset="-5">
    <polyline class="icon__part p1" points="0,0 0,11" stroke-width="3" transform="translate(12,12) rotate(0)" data-anim-end/><polyline class="icon__part p1" points="0,0 0,11" stroke-width="2" transform="translate(12,12) rotate(45)"/>
    <polyline class="icon__part p1" points="0,0 0,11" stroke-width="3" transform="translate(12,12) rotate(90)"/><polyline class="icon__part p1" points="0,0 0,11" stroke-width="2" transform="translate(12,12) rotate(135)"/>
    <polyline class="icon__part p1" points="0,0 0,11" stroke-width="3" transform="translate(12,12) rotate(180)"/><polyline class="icon__part p1" points="0,0 0,11" stroke-width="2" transform="translate(12,12) rotate(225)"/>
    <polyline class="icon__part p1" points="0,0 0,11" stroke-width="3" transform="translate(12,12) rotate(270)"/><polyline class="icon__part p1" points="0,0 0,11" stroke-width="2" transform="translate(12,12) rotate(315)"/></g></svg></span><span>Morph</span></button>
  <button class="ctl" id="freeze"><span class="sq amber"><svg class="i-standby" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#fff">
    <polyline class="icon__part p1" points="12,2 12,12" stroke-dasharray="10 10" stroke-width="3" data-anim-end/><circle class="icon__part p2" cx="12" cy="12" r="8" stroke-dasharray="50.265 50.265" stroke-dashoffset="-8.378" stroke-width="2" transform="rotate(-120,12,12)"/></g></svg></span><span id="freezeTxt">Freeze</span></button>
  <button class="ctl" id="reset"><span class="sq blue"><svg class="i-reset" viewBox="0 0 24 24" aria-hidden="true"><g class="icon__part p1" data-anim-end><path fill="#fff" d="M19 12A7 7 0 0 0 8.4 6H9a1 1 0 0 1 0 2H6a1 1 0 0 1-1-1V4a1 1 0 0 1 2 0v.52a9 9 0 1 1-3.93 6.36 1 1 0 1 1 1.98.24Q5 11.55 5 12a7 7 0 1 0 14 0"/></g></svg></span><span>Reset</span></button>
</div>

<div id="toast" role="status"><div class="in"><span class="orb" id="tOrb">W</span><div><div class="k" id="tK"></div><div class="m" id="tM"></div><div class="s" id="tS"></div></div></div></div>
<div class="err" id="err">This scene needs WebGL and a network connection for three.js.</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, RM ? 1 : ms));

/* ============ Config ============ */
const ENGINES = [
  {name:'Coordinate', d:'Breaks a goal into steps and sends each one to its real owner.', wave:{a:1, b:0, cycles:2}},
  {name:'Discover', d:'Mycelium finds people who should meet, and introduces them once they agree.', wave:{a:1, b:1, cycles:3}},
  {name:'Evolve', d:'Darwin replays past requests and evolves shorter routes.', wave:{a:0, b:1, cycles:4}},
];
const PALETTES = [   // per level: root → outer shell, plus hub and person accents

function hideToast() { $('toast').classList.remove('show'); }
let storyIx = 0, lastStory = 0;
async function story() {
  const fi = S.formation, f = F[fi], run = ++S.run, alive = () => run === S.run && !S.morphing;
  const list = STORIES[fi], [a, b, what] = list[storyIx++ % list.length];
  const li = name => { const h = HUBS.indexOf(name); if (h >= 0) return {lab:hubLabels[h], i:f.hubs[h]}; const p = PEOPLE.indexOf(name); return {lab:personLabels[p], i:f.people[p]}; };
  const A = li(a), Bn = li(b); if (A.i == null || Bn.i == null) return;
  const path = bfs(f.adj, A.i, Bn.i); if (!path || path.length < 2) return;
  A.lab.d.classList.add('hot'); Bn.lab.d.classList.add('hot'); pulseAt(nodePos(A.i, new THREE.Vector3()));
  if (fi === 0) {
    toast('route', 'Wayfinder is routing', `${a} → ${b}`, `${what}`);
    const r = await travel(path, 0x7fe3ff, 380 * path.length + 400); if (!alive()) return;
    toast('route', 'Delivered by iMessage', `${a} → ${b}`, `${what} <span class="hops">${path.length - 1} ${path.length === 2 ? 'hop' : 'hops'}</span>`);
    await sleep(2600); if (!alive()) return; await fadeRoute(r);
  } else if (fi === 1) {
    toast('myc', 'Mycelium found a match', `${a} and ${b} should meet`, what);
    const r = await travel(path, 0xff8fd0, 420 * path.length + 400); if (!alive()) return;
    await sleep(2600); if (!alive()) return; await fadeRoute(r);
  } else {
    // Evolve: replay the old detour, then Darwin's shortcut; the sea morphs from sine A into sine B
    const via = f.hubs[(HUBS.indexOf(b) + 3) % HUBS.length], p1 = bfs(f.adj, A.i, via), p2 = bfs(f.adj, via, Bn.i);
    const longPath = p1 && p2 ? p1.concat(p2.slice(1)) : path;
    toast('evo', 'Darwin is replaying last quarter', `${a} → ${b}`, `${what}: ${longPath.length - 1} hops, 9 days`);
    setWave({a:1, b:0, cycles:4}, 900);
    const r1 = await travel(longPath, 0xff9a6a, 300 * longPath.length + 300); if (!alive()) return;
    await sleep(600); fadeRoute(r1, 900); setWave({a:1, b:1, cycles:4}, 1200); await sleep(700); if (!alive()) return;
    setWave({a:0, b:1, cycles:4}, 1400);
    const r2 = await travel([A.i, Bn.i], 0xffd86b, 1100, {straight:true}); if (!alive()) return;
    toast('evo', 'Darwin evolved a better rule', `${a} → ${b} directly`, `${what} <span class="hops">${longPath.length - 1} hops → 1</span>`);
    await sleep(2800); if (!alive()) return; await fadeRoute(r2);
  }
  A.lab.d.classList.remove('hot'); Bn.lab.d.classList.remove('hot'); hideToast();
}

/* ============ Controls ============ */
document.querySelectorAll('.ctl').forEach(b => { const sq = b.querySelector('.sq');
  ['mouseenter', 'focus'].forEach(ev => b.addEventListener(ev, () => sq.classList.add('anim')));
  b.querySelector('[data-anim-end]').addEventListener('animationend', () => sq.classList.remove('anim')); });
$('morph').addEventListener('click', () => { morphTo((S.formation + 1) % 3); lastMorph = performance.now(); });
$('freeze').addEventListener('click', () => { S.paused = !S.paused; $('freezeTxt').textContent = S.paused ? 'Play' : 'Freeze'; controls.autoRotate = !S.paused && !RM; });
$('reset').addEventListener('click', () => { controls.reset(); });
document.querySelectorAll('.theme-button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.theme-button').forEach(x => x.classList.toggle('active', x === b)); applyTheme(+b.dataset.theme); }));
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { if (+b.dataset.f !== S.formation) { morphTo(+b.dataset.f); lastMorph = performance.now(); } }));
$('auto').addEventListener('click', e => { S.auto = !S.auto; e.currentTarget.setAttribute('aria-pressed', String(S.auto)); });
$('auto').setAttribute('aria-pressed', String(S.auto));
let dTimer; $('density').addEventListener('input', e => { const v = +e.target.value; e.target.style.setProperty('--val', ((v - 30) / 70 * 100) + '%'); $('dval').textContent = v + '%';
  clearTimeout(dTimer); dTimer = setTimeout(() => { S.density = v / 100; morphTo(S.formation, {rebuild:true}); }, 400); });

/* ============ Loop ============ */
const clock = new THREE.Clock(); let lastMorph = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, clock.getDelta());
  if (!S.paused) S.time += dt; U.uTime.value = S.time;
  const now = performance.now();
  if (S.auto && !S.paused && !S.morphing) {
    if (now - lastMorph > 21000) { lastMorph = now; morphTo((S.formation + 1) % 3); }
    else if (now - lastStory > 8000) { lastStory = now; story(); }
  }
  const breathe = 1 + Math.sin(S.time * 1.2) * .03; heart.scale.setScalar(breathe); shell.rotation.y += dt * .2;
  coreLabel.o.position.set(0, 0, 0);
  if (N) hubLabels.concat(personLabels).forEach(l => l.o.position.copy(nodePos(l.idx)));
  controls.update(); composer.render(); labelRenderer.render(scene, camera);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight); bloom.resolution.set(innerWidth, innerHeight); U.uRes.value.set(innerWidth * DPR, innerHeight * DPR); });

paintLabelDots();
F = [0, 1, 2].map(i => buildFormation(i, S.density));
morphTo(0, {rebuild:false});
lastStory = performance.now() - 5000;
frame();
</script>
</body>
</html>
