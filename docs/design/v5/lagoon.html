<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinder Lagoon</title>
<link rel="stylesheet" href="shared/aero.css">
<style>
html,body{overflow:hidden}
/* ============ Ocean backdrop: Aero aqua, retinted per theme ============ */
#sea{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#8fe0f6 0%,#2aa9d8 28%,#0b74a8 62%,#0a4f7c 85%,#0d324e 100%);transition:background .8s}
:root[data-theme="1"] #sea{background:linear-gradient(180deg,#b4f0d6 0%,#3fbf9f 28%,#0f7f72 62%,#0b5652 85%,#0b3a3e 100%)}
:root[data-theme="2"] #sea{background:linear-gradient(180deg,#ffd2b8 0%,#e5849a 28%,#9a4c8e 62%,#5a3484 85%,#2a1f4e 100%)}
#ocean{position:fixed;inset:0;z-index:1}
#ocean canvas{display:block;width:100%;height:100%}
/* soft light rays from the surface */
#rays{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;mix-blend-mode:screen}
#rays i{position:absolute;top:-20%;height:130%;transform-origin:50% 0;filter:blur(10px);
  background:linear-gradient(180deg,rgb(255 255 255/.42),rgb(255 255 255/.12) 45%,transparent 80%);animation:ray 11s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.35;rotate:var(--r)}to{opacity:.9;rotate:calc(var(--r) + 4deg)}}
#surface{position:fixed;left:0;right:0;top:0;height:120px;z-index:2;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 0%,rgb(255 255 255/.45),transparent 70%)}

/* ============ Tentacle links ============ */
#links{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible}
#links .glow{fill:none;stroke:url(#linkGrad);stroke-linecap:round;filter:url(#linkBlur);transition:opacity .5s}
#links .core{fill:none;stroke:rgb(255 255 255/.85);stroke-linecap:round;transition:opacity .5s}
#links .flow{fill:none;stroke:url(#linkGrad);stroke-linecap:round;stroke-dasharray:3 22;transition:opacity .5s}
#links g.off path{opacity:0!important}
#links g.hot .glow{opacity:1!important}

/* ============ Jellyfish: you ============ */
#jelly{position:fixed;left:50%;top:48%;z-index:5;width:min(300px,36vh);translate:-50% -50%;pointer-events:none}
#jelly svg{width:100%;height:auto;display:block;overflow:visible;
  filter:drop-shadow(0 0 16px color-mix(in srgb,var(--accent-hi) 75%,transparent)) drop-shadow(0 0 46px color-mix(in srgb,var(--match) 40%,transparent))}
#jelly .you{position:absolute;left:50%;top:100%;translate:-50% -4px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
#jelly .you .lbl{font-size:14px}

/* ============ Seed cards in orbit ============ */
#seeds{position:fixed;inset:0;z-index:8;pointer-events:none}
.seed{position:absolute;left:0;top:0;width:240px;perspective:900px;pointer-events:auto;will-change:transform;transition:opacity .5s var(--ease)}
.seed.hidden{opacity:0;pointer-events:none}
.seed .milk{border-radius:18px;animation:seedIn .8s var(--spring) backwards;animation-delay:calc(var(--k,0) * 120ms + 300ms)}
.seed.sent .milk{animation:none}
@keyframes seedIn{from{opacity:0;transform:scale(.8)}}
.seed .body{padding:12px 14px 12px;display:grid;gap:8px}
.seed .who{display:flex;align-items:center;gap:10px}
.seed .who .orb{width:38px;height:38px;font-size:16px}
.seed .nm{font-weight:600;font-size:15px;line-height:1.15}
.seed .dp{font-size:12px;color:var(--ink-2)}
.seed .topic .chip{white-space:nowrap}
.seed .topic{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.seed .why{font-size:13px;line-height:1.35;color:var(--ink-2)}
.seed .ctl{padding:4px 14px 4px 4px;font-size:14px;justify-self:start}
.seed .ctl[disabled]{cursor:default;transform:none;opacity:.95}
.seed.sent .milk{box-shadow:0 0 0 2px rgb(255 255 255/.9),0 0 24px color-mix(in srgb,var(--match) 70%,transparent),0 8px 28px rgb(0 40 100/.18)}

/* ============ Corner card ============ */
#intro{left:28px;top:28px;width:330px}
#intro .body{display:grid;gap:10px}
#intro .stats{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:700px){
  html,body{overflow:auto}
  #intro{position:relative;left:auto;top:auto;width:auto;margin:12px}
  #jelly{position:relative;left:auto;top:auto;translate:none;margin:8px auto 40px;width:200px}
  #links{display:none}
  #seeds{position:relative;inset:auto;display:grid;gap:12px;padding:0 12px 110px}
  .seed{position:relative;width:auto;transform:none!important}
  .seed.hidden{display:none}
}
</style>
</head>

/* ============ Light rays ============ */
[[8, 9, -14], [24, 6, -6], [41, 11, 3], [58, 7, 9], [74, 10, 15], [90, 6, 20]].forEach(([l, w, r], i) => {
  const b = document.createElement('i'); Object.assign(b.style, {left:l + '%', width:w + 'vw', animationDelay:(-i * 2.3) + 's'}); b.style.setProperty('--r', r + 'deg'); $('rays').appendChild(b); });

  seabed:{radius:660, height:700, rSeg:50, hSeg:20, ampR:20, speedC:.015, rotation:.005, y:-620, z:-50, step:.000005},
  water:{groups:22, members:20, depth:450, step:.0015},

};
const SEABED = [0x4fae9e, 0x6cbf5c, 0xd99a7a];   // per theme: seafoam, kelp, coral sand
const FOG = [0x3ab6d8, 0x3fb59a, 0xc06a8e];

try { ocean = buildOcean(); } catch (e) { console.warn(e); $('err').style.display = 'block'; }

function buildOcean() {
  const W = innerWidth, H = innerHeight;
  const renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(W, H);
  $('ocean').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(FOG[Aero.theme], -200, 1150);
  const camera = new THREE.PerspectiveCamera(60, W / H, 1, 10000);
  camera.position.set(0, 350, 600); camera.rotation.x = -PI / 32;
  scene.add(new THREE.AmbientLight(0x9fe8ff, .55), new THREE.HemisphereLight(0xffffff, 0x0a3a5a, 1.0));
  const sun = new THREE.DirectionalLight(0xfffbe8, 1.1); sun.position.set(-200, 900, 300); scene.add(sun);

  // Seabed: rotated bumpy cylinder; vertices merged so the bumps don't tear at the seam
  let g = new THREE.CylinderGeometry(SHAPES.seabed.radius, SHAPES.seabed.radius, SHAPES.seabed.height, SHAPES.seabed.rSeg, SHAPES.seabed.hSeg);
  g.rotateX(-PI / 2); g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g);
  const pos = g.getAttribute('position'), bumps = [];
  for (let i = 0; i < pos.count; i++) bumps.push({x:pos.getX(i), y:pos.getY(i), ang:Math.random() * PI * 2, amp:Math.random() * SHAPES.seabed.ampR, speed:SHAPES.seabed.speedC + Math.random() * SHAPES.seabed.speedC});
  const seabedMat = new THREE.MeshPhongMaterial({color:SEABED[Aero.theme], flatShading:true, shininess:30, specular:0x88ccdd});
  const seabed = new THREE.Mesh(g, seabedMat); seabed.position.set(0, SHAPES.seabed.y, SHAPES.seabed.z); scene.add(seabed);

  // Water ring: fish (kept from the pen) and glass seeds (in place of bottles, cans, tires)
  const seedGeo = new THREE.SphereGeometry(1, 18, 14);
  const seedMats = Aero.palette().levels.map(c => new THREE.MeshPhongMaterial({color:c, emissive:new THREE.Color(c).multiplyScalar(.28), specular:0xffffff, shininess:140, transparent:true, opacity:.82}));
  const coneHead = new THREE.ConeGeometry(SHAPES.fish.radius, SHAPES.fish.height * 8 / 15, SHAPES.fish.segments);
  const coneBody = new THREE.ConeGeometry(SHAPES.fish.radius, SHAPES.fish.height, SHAPES.fish.segments);
  const coneTail = new THREE.ConeGeometry(SHAPES.fish.radius / 2, SHAPES.fish.height * 7 / 15, Math.round(SHAPES.fish.segments / 3));
  function fish() {
    const m = new THREE.Object3D(), h = SHAPES.fish.height;
    const mat = new THREE.MeshPhongMaterial({color:new THREE.Color(`rgb(255,${Math.floor(95 + Math.random() * 100)},${Math.floor(Math.random() * 20)})`), flatShading:true, shininess:60});
    const head = new THREE.Mesh(coneHead, mat), body = new THREE.Mesh(coneBody, mat), tail = new THREE.Mesh(coneTail, mat);
    body.rotation.x = PI; body.position.y -= h * .77; tail.position.y -= h * 4 / 3; m.add(head, body, tail); return m;
  }
  const water = new THREE.Object3D(), seeds = [];
  const step = PI * 2 / SHAPES.water.groups;
  for (let j = 0; j < SHAPES.water.groups; j++) {
    const angle = step * j;
    for (let i = 0; i < SHAPES.water.members; i++) {
      const type = Math.floor(Math.random() * 30); let obj, offset;
      if (type < 22) {
        offset = (PI / 4) * (Math.random() * .4 - .8);
        obj = new THREE.Mesh(seedGeo, seedMats[type % seedMats.length]); obj.scale.setScalar(2.4 + Math.random() * 4.2);
        obj.userData.bob = Math.random() * PI * 2; seeds.push(obj);
      } else {
        offset = (PI / 8) * (Math.random() * .4 - .8);
        obj = fish(); obj.rotation.z = angle + offset;
      }
      obj.position.z = -Math.random() * SHAPES.water.depth;
      const depth = SHAPES.seabed.height + Math.random() * SHAPES.water.depth * 1.5;
      obj.position.x = Math.cos(angle + offset) * depth; obj.position.y = Math.sin(angle + offset) * depth;
      obj.userData.base = obj.position.y; water.add(obj);
    }
  }
  water.position.y = SHAPES.seabed.y; scene.add(water);

  // Woodsprites: soft glowing seed points that drift up through the view
  const SN = RM ? 70 : 160, sp = [], ss = [], sc = [], sd = [];
  for (let i = 0; i < SN; i++) { sp.push(THREE.MathUtils.randFloatSpread(1100), Math.random() * 760, THREE.MathUtils.randFloat(-420, 260)); ss.push(THREE.MathUtils.randFloat(6, 16)); sd.push(Math.random() * 100, THREE.MathUtils.randFloat(4, 12)); }
  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3)); sGeo.setAttribute('aSize', new THREE.Float32BufferAttribute(ss, 1)); sGeo.setAttribute('aSeed', new THREE.Float32BufferAttribute(sd, 2));
  sGeo.setAttribute('aColor', new THREE.Float32BufferAttribute(new Float32Array(SN * 3), 3));
  const sMat = new THREE.ShaderMaterial({transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, uniforms:{uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}},
    vertexShader:`attribute float aSize; attribute vec2 aSeed; attribute vec3 aColor; uniform float uTime, uPixel; varying vec3 vCol; varying float vSpin; varying float vFade;
      void main(){ vec3 p = position; float t = uTime * aSeed.y;
        p.y = mod(p.y + t, 760.0); p.x += sin(uTime * 0.3 + aSeed.x) * 22.0; p.z += cos(uTime * 0.25 + aSeed.x) * 14.0;
        vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = aSize * uPixel * (520.0 / -mv.z); gl_Position = projectionMatrix * mv;
        vCol = aColor; vSpin = uTime * 0.4 + aSeed.x; vFade = smoothstep(0.0, 60.0, p.y) * smoothstep(760.0, 640.0, p.y); }`,
    fragmentShader:`varying vec3 vCol; varying float vSpin; varying float vFade;
      void main(){ vec2 c = gl_PointCoord * 2.0 - 1.0; float d = length(c); if (d > 1.0) discard;
        float ang = atan(c.y, c.x) + vSpin;
        float tendril = pow(abs(cos(ang * 4.0)), 24.0) * smoothstep(1.0, 0.15, d) * 0.55;
        float core = smoothstep(0.22, 0.0, d), halo = smoothstep(1.0, 0.0, d) * 0.35;
        vec3 col = mix(vCol, vec3(1.0), core * 0.8);
        gl_FragColor = vec4(col, (core + halo + tendril) * vFade); }`});
  const sprites = new THREE.Points(sGeo, sMat); sprites.frustumCulled = false; scene.add(sprites);

  function tint(pal, ti) {
    seabedMat.color.set(SEABED[ti]); scene.fog.color.set(FOG[ti]);
    seedMats.forEach((m, i) => { m.color.set(pal.levels[i]); m.emissive.set(pal.levels[i]).multiplyScalar(.28); });
    const ca = sGeo.getAttribute('aColor'), cols = [0xffffff, pal.match, pal.levels[1], pal.levels[4], 0xc8ff9a].map(c => new THREE.Color(c));
    for (let i = 0; i < SN; i++) { const c = cols[i % cols.length]; ca.setXYZ(i, c.r, c.g, c.b); } ca.needsUpdate = true;
  }
  tint(Aero.palette(), Aero.theme);

  const mouse = {x:0, y:0};
  addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = 1 - e.clientY / innerHeight * 2; });
  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

  function update(dt, time) {
    const k = dt * 60;   // the pen stepped per frame at 60 fps
    if (!RM) {
      for (let i = 0; i < pos.count; i++) { const b = bumps[i]; pos.setXY(i, b.x + Math.cos(b.ang) * b.amp, b.y + Math.sin(b.ang) * b.amp); b.ang += b.speed * k; }
      pos.needsUpdate = true;
      seabed.rotation.z += (SHAPES.seabed.rotation * .2 + SHAPES.seabed.step) * k;
      water.rotation.z += SHAPES.water.step * k;
      for (const s of seeds) s.position.y = s.userData.base + Math.sin(time * .8 + s.userData.bob) * 4;
      sMat.uniforms.uTime.value = time;
    }
    camera.position.x += (mouse.x * 40 - camera.position.x) * .03;
    camera.position.y += (350 + mouse.y * 18 - camera.position.y) * .03;
    renderer.render(scene, camera);
  }
  return {update, tint};
}

/* ============ Jellyfish motion (pasted TweenMax timeline, in GSAP 3) ============ */
if (!RM && window.gsap) {
  gsap.to('#feturbulence', {attr:{baseFrequency:'0.06 0'}, duration:5, repeat:-1, yoyo:true, ease:'none'});
  gsap.to('#jfSvg', {y:-30, duration:3, repeat:-1, yoyo:true, ease:'sine.inOut', delay:.2});
  gsap.from('.bubble', {scale:.2, opacity:.2, duration:4, transformOrigin:'50% 50%', ease:'none', stagger:{each:1, repeat:-1, yoyo:true}});
  gsap.timeline({repeat:-1, repeatDelay:5})
    .to('.eye', {scaleY:.5, opacity:.2, transformOrigin:'50% 50%', duration:.5, delay:3, ease:'back.out(1.7)'})
    .to('.eye', {scaleY:1, opacity:1, transformOrigin:'50% 50%', duration:.5, ease:'back.out(1.7)'});
}

/* ============ Seeds: Mycelium matches that involve you ============ */
const ORBS = ['blue', 'amber', 'pink', '', 'accent'];
const kindOf = m => m.kind || (/spare|ticket|budget|server|license/i.test(m.why) ? 'resource' : /same team|buddy|joined/i.test(m.why + m.topic) ? 'team' : 'query');
const mine = WF.matches.filter(m => m.a === me.id || m.b === me.id).sort((x, y) => y.score - x.score).map((m, i) => {
  const other = WF.person(m.a === me.id ? m.b : m.a);
  return {m, other, kind:kindOf(m), i, sent:false, x:innerWidth / 2, y:innerHeight / 2, tx:0, ty:0};
});
$('nSeeds').textContent = `${mine.length} seeds near you`;
$('nIntros').textContent = `${WF.stats.introsMade} intros made`;

const NS = 'http://www.w3.org/2000/svg', linksSvg = $('links');
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent?.appendChild(e); return e; };
const handshake = `<g class="icon__part p1" data-anim-end fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="8" r="3"/><path d="M3 19c.6-3.2 2.6-5 5-5s4.4 1.8 5 5M13.2 14.6c.9-.4 2-.6 3.3-.6 2.4 0 4.4 1.8 5 5"/></g>`;
const sentIcon = `<g class="icon__part p1" data-anim-end fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"/></g>`;

function cardHTML(s) {
  const o = s.other, pct = Math.round(s.m.score * 100);
  const btn = s.sent
    ? `<button class="ctl" disabled><span class="sq green"><svg class="i-bob" viewBox="0 0 24 24" aria-hidden="true">${sentIcon}</svg></span><span>Intro sent ✓</span></button>`
    : `<button class="ctl" data-intro="${s.i}"><span class="sq green"><svg class="i-bob" viewBox="0 0 24 24" aria-hidden="true">${handshake}</svg></span><span>Introduce</span></button>`;
  return `<div class="milk"><div class="body">
    <div class="who"><span class="orb ${ORBS[s.i % ORBS.length]}">${o.first[0]}</span><div><div class="nm">${o.name}</div><div class="dp">${o.deptName} · ${o.subName}</div></div></div>
    <div class="topic"><span>${s.m.topic}</span><span class="chip${pct < 75 ? ' info' : ''}">${pct}% match</span></div>
    <p class="why">${/^both /.test(s.m.why) ? `You and ${o.first} ${s.m.why}` : s.m.why[0].toUpperCase() + s.m.why.slice(1)}.</p>
    ${btn}</div></div>`;
}
mine.forEach(s => {
  s.el = document.createElement('article'); s.el.className = 'seed'; s.el.style.setProperty('--k', s.i); s.el.innerHTML = cardHTML(s); $('seeds').appendChild(s.el);
  s.g = svgEl('g', {}, linksSvg);
  const w = 1.2 + s.m.score * 3.4;
  s.glow = svgEl('path', {class:'glow', 'stroke-width':w * 3.2, opacity:.3 + s.m.score * .45}, s.g);
  s.core = svgEl('path', {class:'core', 'stroke-width':w * .5, opacity:.35 + s.m.score * .4}, s.g);
  s.flow = svgEl('path', {class:'flow', 'stroke-width':w * 1.2, opacity:.9}, s.g);
  s.el.addEventListener('mouseenter', () => s.g.classList.add('hot'));
  s.el.addEventListener('mouseleave', () => s.g.classList.remove('hot'));
});
Aero.wireCandy($('seeds'));

/* ============ Filter ============ */
let filter = 'all';
document.querySelectorAll('#intro .seg button').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('#intro .seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  mine.forEach(s => { const on = filter === 'all' || s.kind === filter; s.el.classList.toggle('hidden', !on); s.g.classList.toggle('off', !on); });
  layout();
}));

/* ============ Orbit layout: upper arc, keeping clear of the corner card and the dock ============ */
const mobile = () => innerWidth <= 700;
function layout() {
  if (mobile()) return;
  const vis = mine.filter(s => !s.el.classList.contains('hidden')), n = vis.length;
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H * .48;
  const rx = Math.min(W * .37, 560), ry = Math.min(H * .36, 310);
  // slots: one or two on the left (below the corner card), the rest on the upper-right arc
  const L = n >= 6 ? 2 : n >= 3 ? 1 : 0, lin = (a, b, m) => m <= 1 ? [(a + b) / 2] : Array.from({length:m}, (_, i) => a + (b - a) * i / (m - 1));
  const slots = n === 1 ? [-90] : n === 2 ? [-125, -45] : [...lin(-200, -180, L), ...lin(-122, 24, n - L)];
  const corner = $('intro').getBoundingClientRect();
  vis.forEach((s, k) => {
    const a = slots[k] * PI / 180;
    const w = s.el.offsetWidth, h = s.el.offsetHeight;
    let x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
    x = Math.min(W - w / 2 - 20, Math.max(w / 2 + 20, x));
    y = Math.min(H - 120 - h / 2, Math.max(h / 2 + 20, y));
    if (x - w / 2 < corner.right + 14 && y - h / 2 < corner.bottom + 14) {   // would sit under the corner card
      if (corner.right + 14 + w / 2 < cx - 140) x = Math.max(x, corner.right + 14 + w / 2); else y = corner.bottom + 14 + h / 2;
    }
    s.tx = x; s.ty = y;
  });
}

/* ============ Tentacle curves ============ */
const jfSvg = $('jfSvg');
function jellyOrigin(i) {   // a point among the tentacles, in screen space (follows the GSAP bob)
  const m = jfSvg.getScreenCTM(); if (!m) return {x:innerWidth / 2, y:innerHeight / 2};
  const p = jfSvg.createSVGPoint(); p.x = 240 + (i % 5) * 16; p.y = 300 + (i % 2) * 18; const q = p.matrixTransform(m); return {x:q.x, y:q.y};
}
function anchor(s, o) {   // nearest point on the card's edge, facing the jellyfish
  const w = s.el.offsetWidth, h = s.el.offsetHeight, dx = o.x - s.x, dy = o.y - s.y;
  const sx = Math.abs(dx) / (w / 2), sy = Math.abs(dy) / (h / 2), f = 1 / Math.max(sx, sy, 1e-3);
  return {x:s.x + dx * f, y:s.y + dy * f};
}
function curve(s, t) {
  const o = jellyOrigin(s.i), e = anchor(s, o), dx = e.x - o.x, dy = e.y - o.y, len = Math.hypot(dx, dy) || 1;
  const px = -dy / len, py = dx / len, wig = RM ? 0 : Math.sin(t * 1.1 + s.i * 1.7) * Math.min(60, len * .16);
  // tentacles hang down first, then sweep out to the card
  const c1 = {x:o.x + dx * .25 + px * wig, y:o.y + Math.max(70, len * .25) + py * wig};
  const c2 = {x:o.x + dx * .7 - px * wig * .8, y:o.y + dy * .7 - py * wig * .8};
  return `M${o.x.toFixed(1)} ${o.y.toFixed(1)}C${c1.x.toFixed(1)} ${c1.y.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)} ${e.x.toFixed(1)} ${e.y.toFixed(1)}`;
}

/* ============ Introduce: a pulse travels the tentacle, then the card flips ============ */
const pulses = [];
$('seeds').addEventListener('click', e => {
  const b = e.target.closest('[data-intro]'); if (!b) return;
  const s = mine[+b.dataset.intro]; if (s.sent) return; s.sent = true; b.disabled = true;
  const dot = svgEl('circle', {r:7, fill:'#fff', filter:'url(#pulseGlow)'}, linksSvg);
  pulses.push({s, dot, t0:performance.now(), dur:RM ? 1 : 1100});
  s.g.classList.add('hot');
});
function landPulse(p) {
  p.dot.remove(); const s = p.s, o = s.other;
  Aero.toast('myc', 'Mycelium found a match', `${me.first} and ${o.first} should meet`, s.m.why);
  const swap = () => { s.el.innerHTML = cardHTML(s); s.el.classList.add('sent'); Aero.wireCandy(s.el); };
  if (RM || !window.gsap) { swap(); s.g.classList.remove('hot'); return; }
  const card = s.el.querySelector('.milk');
  gsap.timeline().to(card, {rotationY:90, duration:.25, ease:'power2.in'})
    .add(() => { swap(); gsap.fromTo(s.el.querySelector('.milk'), {rotationY:-90}, {rotationY:0, duration:.45, ease:'back.out(1.8)'}); })
    .add(() => s.g.classList.remove('hot'), '+=1.2');
}

/* ============ Loop ============ */
const clock = new THREE.Clock(); let time = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, clock.getDelta()); time += dt;
  ocean?.update(dt, time);
  if (!mobile()) {
    for (const s of mine) {
      const bx = RM ? 0 : Math.cos(time * .4 + s.i * 1.3) * 6, by = RM ? 0 : Math.sin(time * .6 + s.i) * 9;
      s.x += (s.tx + bx - s.x) * (RM ? 1 : .06); s.y += (s.ty + by - s.y) * (RM ? 1 : .06);
      s.el.style.transform = `translate(${(s.x - s.el.offsetWidth / 2).toFixed(1)}px,${(s.y - s.el.offsetHeight / 2).toFixed(1)}px)`;
      const d = curve(s, time); s.glow.setAttribute('d', d); s.core.setAttribute('d', d); s.flow.setAttribute('d', d);
      s.flow.setAttribute('stroke-dashoffset', RM ? 0 : (-time * 30 - s.i * 7).toFixed(1));
    }
  }
  const now = performance.now();
  for (let k = pulses.length - 1; k >= 0; k--) {
    const p = pulses[k], t = Math.min(1, (now - p.t0) / p.dur), path = p.s.core, L = path.getTotalLength();
    const pt = path.getPointAtLength(L * (1 - Math.pow(1 - t, 2))); p.dot.setAttribute('cx', pt.x); p.dot.setAttribute('cy', pt.y);
    if (t >= 1) { pulses.splice(k, 1); landPulse(p); }
  }
}
addEventListener('resize', layout);
Aero.onTheme((ti, pal) => ocean?.tint(pal, ti));

requestAnimationFrame(() => {
  layout(); mine.forEach(s => { s.x = s.tx; s.y = s.ty + 30; });
  frame();
});
setTimeout(() => Aero.toast('myc', 'Mycelium is listening', `${mine.length} seeds drifted near you`, `Strongest: ${mine[0].other.first} · ${mine[0].m.topic}`), RM ? 0 : 1600);
</script>
</body>
</html>
